<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    />

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/icons.js"></script>

    <script src="js/header.js?v=2"></script>

    <!-- Web-Component für die Lottie-Konfetti-Animation im Gewinner-Pop-up -->
    <script
      type="module"
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.27/dist/index.js"
    ></script>
  </head>

  <body>
    <game-header leave rules="multi-player"></game-header>

    <main>
      <!-- GAME SCREEN -->
      <section id="game-screen" class="screen">
        <h2 id="current-player-title" class="page-title">Player One</h2>
        <section id="character-grid" class="character-grid"></section>

        <!-- Zähler und Buttons bleiben am unteren Rand kleben, damit sie
             auch auf kleinen Bildschirmen sichtbar sind.

             Reihenfolge von links nach rechts: erst die Nebenaktion, dann
             die Sonderaktion, zuletzt die Hauptaktion. -->
        <section class="game-controls">
          <span id="remaining-counter"> Remaining characters: 0 </span>

          <button id="reset-button" class="secondary" type="button">
            <span data-icon="refresh"></span>
            Reset board
          </button>

          <!-- Die Beschriftung wechselt zwischen "Final Guess" und
               "Cancel guess" (siehe js/game.js). Sie steckt in einem
               eigenen Span, damit das Icon daneben stehen bleibt. -->
          <button id="final-guess-button" class="accent-2" type="button">
            <span data-icon="target"></span>
            <span class="button-label">Final Guess</span>
          </button>

          <button id="end-turn-button" type="button">
            End turn
            <span data-icon="arrow-right"></span>
          </button>
        </section>
      </section>

      <!-- WIN POP-UP -->
      <section id="win-overlay" class="overlay hidden">
        <!-- Konfetti liegt über dem ganzen Overlay, klickt aber nicht mit.
             Zu renderconfig siehe single_player.html – dieses Overlay ist
             beim Laden der Seite ebenfalls display: none. -->
        <dotlottie-wc
          id="win-confetti"
          class="win-confetti"
          src="https://lottie.host/7bac9987-1953-40c4-a7de-c141a24e51ee/yTJuAa10iJ.lottie"
          renderconfig='{"autoResize": true, "devicePixelRatio": 1}'
          loop
        ></dotlottie-wc>

        <article class="win-dialog">
          <span class="win-dialog-icon">🎉</span>

          <h2 id="win-title">Congratulations!</h2>

          <p id="win-text"></p>

          <img id="win-character-image" class="win-character-image" alt="" />

          <div class="win-dialog-buttons">
            <button id="home-button" class="secondary" type="button">
              <span data-icon="home"></span>
              Back to start
            </button>

            <button id="new-game-button" type="button">
              <span data-icon="refresh"></span>
              New game
            </button>
          </div>
        </article>
      </section>

      <!-- Das Regeln-Popup hängt js/rules.js selbst ein -->
    </main>

    <script src="js/character_data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/leave.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
