<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="game-header">
      <h1>Guess Who?</h1>

      <button id="cancel-game-button" class="cancel-game-button" type="button">
        Cancel game
      </button>
    </header>

    <main>
      <!-- GAME SCREEN -->
      <section id="game-screen" class="screen">
        <h2 id="current-player-title">Player 1</h2>

        <section class="game-controls">
          <span id="remaining-counter"> Remaining characters: 0 </span>

          <button id="reset-button">Reset Board</button>

          <button id="end-turn-button">End Turn</button>
        </section>

        <section id="character-grid" class="character-grid"></section>
      </section>
    </main>

    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/cancel.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
