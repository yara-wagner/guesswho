<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/header.js"></script>
  </head>

  <body>
    <game-header cancel></game-header>

    <main>
      <!-- GAME SCREEN -->
      <section id="game-screen" class="screen">
        <h2 id="current-player-title">Player 1</h2>

        <section id="character-grid" class="character-grid"></section>

        <!-- Zähler und Buttons bleiben am unteren Rand kleben, damit sie
             auch auf kleinen Bildschirmen sichtbar sind -->
        <section class="game-controls">
          <span id="remaining-counter"> Remaining characters: 0 </span>

          <button id="reset-button">Reset Board</button>

          <button id="end-turn-button">End Turn</button>

          <section class="game-controls">
            <button id="final-guess-button" type="button">Final Guess</button>

            <!-- deine bestehenden Buttons -->
          </section>
        </section>
      </section>

      <!-- WIN POP-UP -->
      <section id="win-overlay" class="overlay hidden">
        <article class="win-dialog">
          <span class="win-dialog-icon">🎉</span>

          <h2 id="win-title">Congratulations!</h2>

          <p id="win-text"></p>

          <img id="win-character-image" class="win-character-image" alt="" />

          <div class="win-dialog-buttons">
            <button id="new-game-button" type="button">New game</button>

            <button id="home-button" type="button">Back to start</button>
          </div>
        </article>
      </section>
    </main>

    <script src="js/character_data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/cancel.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
