    <!-- =============================
         DIE HÜLLE
         =============================

         Diese Seite zeigt selber nichts an. Sie hält nur zwei Dinge:
         die Hintergrundmusik und einen Rahmen, in dem das Spiel läuft.

         Warum? Jede Spielseite ist ein eigenes Dokument. Bei einem
         Seitenwechsel wirft der Browser das alte Dokument weg – samt
         Audio-Objekt. Die Musik konnte deshalb nie wirklich durchlaufen.
         Mit der Hülle ist das nun möglich.

         Diese Seite wechselt nie. Nur der Rahmen darunter navigiert. Das
         <audio> hier bleibt dabei stehen und spielt einfach weiter.

         Die Spielseiten greifen über js/frame.js hierher (gleiche
         Herkunft, der Zugriff ist also erlaubt). Der Spielstand liegt
         weiter in der sessionStorage: Ein Rahmen derselben Herkunft teilt
         sie sich mit dieser Seite, an js/state.js ändert sich nichts.
         ============================= -->

    <style>
      /* Nur für diese Seite – deshalb hier und nicht in css/style.css,
         wo html/body-Höhen die Spielseiten stören würden. */

      html,
      body {
        height: 100%;
        margin: 0;

        /* Die Farbe der Spielseiten, damit beim Laden nichts Weisses
           aufblitzt (--bg in css/style.css) */
        background-color: #fff6ec;
      }

      #game-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>

  <body>
    <!-- loop, damit das Stück ohne Zutun von vorne beginnt.
         Die Lautstärke setzt js/music.js (erst 0, dann eingeblendet).

         preload="none": Die Datei ist 3,5 MB gross und der Ton ist von
         Haus aus aus – vorgeladen würde sie also fast immer umsonst.
         Schlimmer noch: Die Hülle wechselt nie, der Download lief deshalb
         parallel zu jedem Seitenwechsel im Rahmen weiter und nahm den
         Spielseiten die Leitung weg. Auf einem langsamen Gerät stand das
         Board dann zwar schon da, reagierte aber länger nicht.

         Geladen wird jetzt erst beim Einschalten des Tons: play() in
         js/music.js holt die Datei von selber. -->
    <audio id="background-music" src="src/sound/happy.mp3" preload="none" loop>
    </audio>

    <!-- Das src setzt js/shell.js: Beim Neuladen soll wieder die Seite
         kommen, die zum Spielstand passt – nicht die Modus-Auswahl. -->
    <iframe id="game-frame" title="Guess Who?"></iframe>

    <script src="js/state.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/music.js"></script>
  </body>
</html>
