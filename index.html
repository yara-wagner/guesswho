<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="game-header">
      <h1>Guess Who?</h1>

      <p>Schliesse Charaktere aus, indem du auf ihre Karte klickst.</p>
    </header>

    <main>
      <!-- START SCREEN -->
      <section id="start-screen" class="screen">
        <h2>Pass & Play</h2>

        <p>Zwei Spieler spielen gemeinsam an einem Gerät.</p>

        <button id="start-game-button">Start Game</button>
      </section>

      <!-- CHARACTER SELECTION -->
      <section id="selection-screen" class="screen hidden">
        <h2 id="selection-title">Player 1: Choose your character</h2>

        <p>Wähle deinen geheimen Charakter.</p>

        <div id="selection-grid" class="character-grid"></div>
      </section>

      <!-- PASS SCREEN -->
      <section id="pass-screen" class="screen hidden">
        <h2 id="pass-title">Pass the device</h2>

        <p>Übergib das Gerät an den nächsten Spieler.</p>

        <button id="continue-button">Continue</button>
      </section>

      <!-- GAME SCREEN -->
      <section id="game-screen" class="screen hidden">
        <h2 id="current-player-title">Player 1</h2>

        <section class="game-controls">
          <span id="remaining-counter"> Remaining: 0 </span>

          <button id="reset-button">Reset Board</button>

          <button id="end-turn-button">End Turn</button>
        </section>

        <section id="character-grid" class="character-grid"></section>
      </section>
    </main>

    <script src="js/game.js"></script>
  </body>
</html>
