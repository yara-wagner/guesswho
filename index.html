    <link rel="stylesheet" href="css/style.css" />

    <script src="js/icons.js"></script>

    <script src="js/header.js"></script>
  </head>

  <body>
    <game-header></game-header>

    <main>
      <!-- START SCREEN -->
      <section id="start-screen" class="screen mode-selection">
        <h2 class="page-title">Choose game mode</h2>

        <div class="mode-grid">
          <article class="mode-card">
            <div class="mode-tile-wrapper">
              <button
                id="single-player-button"
                class="mode-tile"
                type="button"
                data-mode="single-player"
              >
                <span class="mode-tile-icon">👤</span>
                <span class="mode-tile-name">Single-Player</span>
                <ul class="mode-description">
                  <li>1 player</li>
                  <li>predefined character set</li>
                </ul>
              </button>

              <button
                class="info-button icon-button"
                type="button"
                data-rules="single-player"
                aria-label="Show Single-Player rules"
              >
                <span data-icon="info"></span>
              </button>
            </div>
          </article>

          <article class="mode-card">
            <div class="mode-tile-wrapper">
              <button
                id="start-game-button"
                class="mode-tile"
                type="button"
                data-mode="multi-player"
              >
                <span class="mode-tile-icon">👥</span>
                <span class="mode-tile-name">Multi-Player</span>
                <ul class="mode-description">
                  <li>2 players</li>
                  <li>play offline on the same device</li>
                  <li>predefined or custom character set</li>
                </ul>
              </button>

              <button
                class="info-button icon-button"
                type="button"
                data-rules="multi-player"
                aria-label="Show Multi-Player rules"
              >
                <span data-icon="info"></span>
              </button>
            </div>
          </article>
        </div>
      </section>
    </main>

    <!-- RULES POPUP -->
    <div id="rules-modal" class="rules-modal hidden">
      <div class="rules-content">
        <button
          id="close-rules-button"
          class="close-rules-button icon-button"
          type="button"
          aria-label="Close rules"
        >
          <span data-icon="close"></span>
        </button>

        <h2 id="rules-title"></h2>

        <div id="rules-text"></div>
      </div>
    </div>

    <!-- PLAYER NAME POPUP -->
    <div id="player-name-modal" class="player-name-modal hidden">
      <div class="player-name-content">
        <button
          id="close-player-name-button"
          class="close-player-name-button icon-button"
          type="button"
          aria-label="Close player name selection"
        >
          <span data-icon="close"></span>
        </button>

        <h2>Enter player names</h2>

        <form id="player-name-form">
          <div class="player-name-field">
            <label for="player1-name">Player One</label>

            <input
              id="player1-name"
              type="text"
              placeholder="Jane"
              maxlength="20"
              autocomplete="off"
            />
          </div>

          <div class="player-name-field">
            <label for="player2-name">Player Two</label>

            <input
              id="player2-name"
              type="text"
              placeholder="Tarzan"
              maxlength="20"
              autocomplete="off"
            />
          </div>

          <button class="continue-button" type="submit">
            Continue
            <span data-icon="arrow-right"></span>
          </button>
        </form>
      </div>
    </div>

    <script src="js/character_data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/start.js"></script>
    <script src="js/rules.js"></script>
  </body>
</html>
