<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    <!-- Inline, damit der Browser dafür keinen Request macht. Quelle: src/favicon.svg -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E .bg { fill: %230F0E0E; } .fg { fill: %23FFFFFF; } @media (prefers-color-scheme: dark) { .bg { fill: %23FFFFFF; } .fg { fill: %230F0E0E; } } %3C/style%3E%3Crect class='bg' width='32' height='32' rx='7' /%3E%3Cg class='fg' transform='translate(-62.87 -11.19) scale(0.6227)'%3E%3Cpath d='M122.333 49.92L122.493 41.64H125.333C126.933 41.64 128.319 40.8533 129.493 39.28C129.759 38.9067 129.946 38.4267 130.053 37.84L130.093 37.36C130.093 36.9333 129.986 36.4533 129.773 35.92C128.866 34.4267 127.573 33.68 125.893 33.68C124.373 33.68 123.159 34.3067 122.253 35.56L117.133 32.32C118.066 30.8533 119.306 29.7067 120.853 28.88C122.426 28.0533 124.106 27.6267 125.893 27.6C127.919 27.6 129.773 28.12 131.453 29.16C133.133 30.2 134.399 31.6 135.253 33.36C135.866 34.72 136.173 36.0533 136.173 37.36C136.173 39.12 135.653 40.84 134.613 42.52C133.146 44.76 131.066 46.3333 128.373 47.24V49.76L122.333 49.92Z' /%3E%3Cpath d='M125.133 59.72C124.119 59.72 123.253 59.36 122.533 58.64C121.813 57.92 121.453 57.0533 121.453 56.04C121.453 55.0533 121.813 54.2 122.533 53.48C123.253 52.76 124.119 52.4 125.133 52.4C126.119 52.4 126.973 52.76 127.693 53.48C128.413 54.2 128.773 55.0533 128.773 56.04C128.773 57.0533 128.413 57.92 127.693 58.64C126.973 59.36 126.119 59.72 125.133 59.72Z' /%3E%3C/g%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/icons.js"></script>
    <script src="js/header.js"></script>

    <!-- Web-Component für die Lottie-Konfetti-Animation im Ergebnis-Pop-up -->
    <script
      type="module"
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.27/dist/index.js"
    ></script>
  </head>

  <body>
    <game-header leave rules="single-player"></game-header>

    <main>
      <section id="single-player-screen" class="screen">
        <h2 id="single-player-set-title" class="page-title"></h2>
        <p id="question-counter">Questions left: 8</p>

        <!-- QUESTION AREA -->
        <section class="question-section">
          <div class="question-row">
            <!-- Der Wrapper trägt den Pfeil, das native Dropdown-Dreieck
                 ist ausgeschaltet (siehe css/style.css) -->
            <div class="question-select-wrapper">
              <select id="question-select">
                <option value="">Select a question...</option>
              </select>

              <span
                class="question-select-icon"
                data-icon="chevron-down"
              ></span>
            </div>

            <button id="ask-question-button" type="button">
              <span data-icon="ask"></span>
              Ask
            </button>
          </div>

          <p id="computer-answer" class="computer-answer"></p>
        </section>

        <!-- CHARACTER BOARD -->
        <section id="single-player-grid" class="character-grid"></section>

        <!-- CONTROLS: erst die Nebenaktion, dann die Hauptaktion -->
        <section class="game-controls">
          <button id="single-reset-button" class="secondary" type="button">
            <span data-icon="refresh"></span>
            Reset board
          </button>

          <!-- Die Beschriftung wechselt zwischen "Final Guess" und
               "Cancel guess" (siehe js/single_player.js). Sie steckt in
               einem eigenen Span, damit das Icon daneben stehen bleibt. -->
          <button id="final-guess-button" class="accent-2" type="button">
            <span data-icon="target"></span>
            <span class="button-label">Final Guess</span>
          </button>
        </section>
      </section>

      <!-- RESULT POP-UP -->

      <!-- Gewinn und Niederlage landen beide hier – dasselbe Muster wie
           beim Multi-Player-Board (siehe game.html). Das Board bleibt
           dahinter stehen, damit man sein Spiel noch einmal sieht. -->
      <section id="result-overlay" class="overlay hidden">
        <!-- Konfetti liegt über dem ganzen Overlay, klickt aber nicht mit.
             Es läuft nur beim Gewinn (siehe js/single_player.js).

             autoResize ist nötig, weil dieses Overlay beim Laden der Seite
             noch display: none ist: Die Component misst ihre Zeichenfläche
             einmal beim Laden der Animation und käme so auf 0 – der Canvas
             behielte seine Standardgrösse und würde von der CSS
             auseinandergezogen. Mit autoResize misst sie neu, sobald das
             Pop-up aufgeht.

             devicePixelRatio: 1, weil die Fläche das ganze Fenster
             abdeckt. Auf einem Handy mit dreifacher Pixeldichte wäre die
             gerechnete Fläche sonst neunmal so gross – für herabfallende
             Konfetti-Schnipsel ist das nicht nötig. -->
        <dotlottie-wc
          id="result-confetti"
          class="win-confetti"
          src="https://lottie.host/7bac9987-1953-40c4-a7de-c141a24e51ee/yTJuAa10iJ.lottie"
          renderconfig='{"autoResize": true, "devicePixelRatio": 1}'
          loop
        ></dotlottie-wc>

        <article class="win-dialog">
          <span id="result-icon" class="win-dialog-icon">🎉</span>

          <h2 id="result-title"></h2>

          <p id="result-message"></p>

          <!-- Nur bei einer Niederlage: Beim Gewinn zeigt das Bild den
               Charakter, auf den gerade richtig getippt wurde. -->
          <p id="result-reveal">The secret character was:</p>

          <img
            id="result-character-image"
            class="win-character-image"
            src=""
            alt=""
          />

          <h3 id="result-character-name"></h3>

          <p id="result-footer"></p>

          <div class="win-dialog-buttons">
            <button id="result-home-button" class="secondary" type="button">
              <span data-icon="home"></span>
              Back to start
            </button>

            <button id="play-again-button" type="button">
              <span data-icon="refresh"></span>
              Play again
            </button>
          </div>
        </article>
      </section>

      <!-- Das Regeln-Popup hängt js/rules.js selbst ein -->
    </main>

    <script src="js/character_data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/leave.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/single_player.js"></script>
  </body>
</html>
