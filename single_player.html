<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/header.js"></script>
  </head>

  <body>
    <game-header cancel></game-header>

    <main>
      <section id="single-player-screen" class="screen">
        <h2>Disney</h2>

        <p id="question-counter">Questions left: 8</p>

        <section class="question-section">
          <div class="question-row">
            <select id="question-select">
              <option value="">Select a question...</option>

              <option value="human">Is your character human?</option>

              <option value="female">Is your character female?</option>

              <option value="male">Is your character male?</option>

              <option value="animal">Is your character an animal?</option>

              <option value="hasHair">Does your character have hair?</option>

              <option value="canFly">Can your character fly?</option>

              <option value="hasWings">Does your character have wings?</option>

              <option value="hasFur">Does your character have fur?</option>

              <option value="wearsHat">Does your character wear a hat?</option>

              <option value="royal">Is your character royal?</option>

              <option value="pixar">
                Is your character from a Pixar movie?
              </option>

              <option value="waterRelated">
                Is your character strongly connected to water?
              </option>

              <option value="magicalCreature">
                Is your character a magical or fantasy creature?
              </option>
            </select>

            <button id="ask-question-button" type="button">Ask</button>
          </div>

          <p id="computer-answer" class="computer-answer"></p>
        </section>
        <section id="single-player-grid" class="character-grid"></section>

        <section class="game-controls">
          <button id="single-reset-button" type="button">Reset Board</button>
        </section>
      </section>
    </main>

    <script src="js/character_data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/cancel.js"></script>
    <script src="js/single_player.js"></script>
  </body>
</html>
