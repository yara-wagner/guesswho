  <link rel="icon"> jeder Seite, damit der Browser dafür keinen Request macht.
  Wenn du hier etwas änderst, musst du den Data-URI in den HTML-Dateien
  neu erzeugen (siehe Kommentar dort).

  Das "?" ist derselbe Glyph wie in src/guesswho_logo_adaptive.svg,
  nur freigestellt und auf 32x32 skaliert – bei 16px im Tab ist die
  komplette Wortmarke nicht lesbar.
-->
