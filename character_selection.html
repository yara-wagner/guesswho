<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guess Who?</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/header.js"></script>
  </head>

  <body>
    <game-header cancel></game-header>

    <main>
      <!-- CHARACTER SELECTION -->
      <section id="selection-screen" class="screen">
        <h2 id="selection-title">Player 1: Choose your character</h2>

        <div id="selection-grid" class="character-grid"></div>

        <!-- Hinweis und Bestätigen-Button bleiben am unteren Rand kleben,
             damit sie auch auf kleinen Bildschirmen sichtbar sind -->
        <div class="selection-actions">
          <p id="selection-hint" class="selection-hint"></p>

          <button
            id="random-selection-button"
            class="random-selection-button"
            type="button"
          >
            🎲 Random character
          </button>

          <button id="confirm-selection-button" type="button" disabled>
            Confirm character
          </button>
        </div>
      </section>
    </main>

    <script src="js/character_data.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/state.js"></script>
    <script src="js/cancel.js"></script>
    <script src="js/selection.js"></script>
  </body>
</html>
